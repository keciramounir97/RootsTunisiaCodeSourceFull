upstream backend_upstream {
    # Dynamically switched by blue-green-deploy.sh between backend_blue:5000 and backend_green:5000
    server backend_blue:5000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost rootstunisia.com server.rootstunisia.com;

    client_max_body_size 100M;

    # Static uploads serving
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri @backend;
    }

    # API Proxy with zero-downtime keepalive and health checks
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
